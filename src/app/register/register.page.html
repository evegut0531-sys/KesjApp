<ion-content [fullscreen]="true" class="register-content">
  <div class="register-wrapper">
    <!-- Top Icon Badge -->
    <div class="top-badge-wrapper ion-text-center">
      <div class="top-badge">
        <ion-icon name="person-add-outline" class="badge-icon"></ion-icon>
      </div>
    </div>

    <!-- Title & Subtitle -->
    <div class="header-text ion-text-center">
      <h1 class="app-title">Crear Cuenta</h1>
      <p class="app-subtitle">Únete a KesjApp y organiza tu día</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="register-form">
      <!-- Nombre Completo -->
      <div class="form-group">
        <label class="field-label">Nombre completo</label>
        <div class="input-container">
          <input
            type="text"
            class="custom-input"
            placeholder="Ej. María Pérez"
            formControlName="displayName"
          />
        </div>
        <div *ngIf="registerForm.get('displayName')?.touched && registerForm.get('displayName')?.invalid" class="field-error">
          <span *ngIf="registerForm.get('displayName')?.errors?.['required']">El nombre es obligatorio.</span>
          <span *ngIf="registerForm.get('displayName')?.errors?.['minlength']">Mínimo 2 caracteres.</span>
        </div>
      </div>

      <!-- Correo Electrónico -->
      <div class="form-group">
        <label class="field-label">Correo electrónico</label>
        <div class="input-container">
          <input
            type="email"
            class="custom-input"
            placeholder="tu@email.com"
            formControlName="email"
          />
        </div>
        <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="field-error">
          <span *ngIf="registerForm.get('email')?.errors?.['required']">El correo es obligatorio.</span>
          <span *ngIf="registerForm.get('email')?.errors?.['email']">Ingresa un correo electrónico válido.</span>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label class="field-label">Contraseña</label>
        <div class="input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="custom-input with-icon"
            placeholder="Mínimo 6 caracteres"
            formControlName="password"
          />
          <button type="button" class="eye-btn" (click)="toggleShowPassword()">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
        <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="field-error">
          <span *ngIf="registerForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</span>
          <span *ngIf="registerForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres.</span>
        </div>
      </div>

      <!-- Confirmar Contraseña -->
      <div class="form-group">
        <label class="field-label">Confirmar contraseña</label>
        <div class="input-container">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="custom-input with-icon"
            placeholder="Repite tu contraseña"
            formControlName="confirmPassword"
          />
          <button type="button" class="eye-btn" (click)="toggleShowConfirmPassword()">
            <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
        <div *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.hasError('passwordMismatch')" class="field-error">
          <span>Las contraseñas no coinciden.</span>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="registerForm.invalid">
        Registrarse
      </button>
    </form>

    <!-- Login Link -->
    <div class="login-prompt ion-text-center">
      <span>¿Ya tienes una cuenta? </span>
      <a routerLink="/login" class="login-link">Iniciar sesión</a>
    </div>
  </div>
</ion-content>

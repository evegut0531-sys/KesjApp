<!-- ================================================= -->
<!-- BOTÓN FLOTANTE (FAB) - SIEMPRE VISIBLE ABAJO A LA DERECHA -->
<!-- ================================================= -->
<div class="habibot-fab" (click)="toggleChat()" [class.fab-hidden]="isChatOpen" title="Abrir Habibot IA">
    <ion-icon name="chatbubbles"></ion-icon>
    <span class="fab-badge" *ngIf="!isChatOpen">IA</span>
</div>

<!-- ================================================= -->
<!-- PANEL DE CHAT OVERLAY (MODAL FLOTANTE) -->
<!-- ================================================= -->
<div class="habibot-overlay" *ngIf="isChatOpen">
    <div class="habibot-chat-panel">

        <!-- Header del chat -->
        <div class="chat-panel-header">
            <div class="chat-header-info">
                <div class="chat-avatar">
                    <ion-icon name="sparkles"></ion-icon>
                </div>
                <div>
                    <h4>Habibot IA</h4>
                    <span class="chat-status">🟢 En línea · KesjApp</span>
                </div>
            </div>
            <div class="chat-header-actions">
                <ion-button fill="clear" size="small" (click)="clearChat()" title="Limpiar chat">
                    <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                </ion-button>
                <ion-button fill="clear" size="small" (click)="toggleChat()" title="Cerrar">
                    <ion-icon name="close" slot="icon-only"></ion-icon>
                </ion-button>
            </div>
        </div>

        <!-- Cuerpo de mensajes -->
        <div class="chat-panel-body" #chatBody>

            <!-- Bienvenida si no hay mensajes -->
            <div class="chat-welcome" *ngIf="chatMessages.length === 0">
                <ion-icon name="sparkles-outline"></ion-icon>
                <p>¡Hola! ✨ Soy <strong>Habibot</strong>, tu asistente de <strong>KesjApp</strong>. ¿En qué te ayudo hoy con tus hábitos, tareas y bienestar?</p>
            </div>

            <!-- Sugerencias rápidas -->
            <div class="chat-suggestions" *ngIf="chatMessages.length === 0">
                <ion-chip *ngFor="let sug of chatSuggestions" outline color="primary" (click)="sendChatFromSuggestion(sug)">
                    <ion-label>{{ sug }}</ion-label>
                </ion-chip>
            </div>

            <!-- Mensajes de conversación -->
            <div *ngFor="let msg of chatMessages"
                 class="chat-msg"
                 [class.chat-msg-user]="msg.role === 'user'"
                 [class.chat-msg-bot]="msg.role === 'assistant'">
                <div class="chat-msg-avatar" *ngIf="msg.role === 'assistant'">
                    <ion-icon name="sparkles"></ion-icon>
                </div>
                <div class="chat-msg-bubble">
                    <p>{{ msg.content }}</p>
                    <span class="chat-msg-time">{{ msg.timestamp | date:'shortTime' }}</span>
                </div>
            </div>

            <!-- Indicador escribiendo -->
            <div class="chat-msg chat-msg-bot" *ngIf="isChatLoading">
                <div class="chat-msg-avatar">
                    <ion-icon name="sparkles"></ion-icon>
                </div>
                <div class="chat-msg-bubble typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- Input del chat -->
        <div class="chat-panel-footer">
            <input
                type="text"
                [(ngModel)]="chatInput"
                placeholder="Pregúntame sobre hábitos, bienestar o login..."
                (keydown.enter)="sendChatMessage()"
                [disabled]="isChatLoading"
                class="chat-text-input" />
            <ion-button fill="solid" color="primary" shape="round" size="small"
                        [disabled]="!chatInput || !chatInput.trim() || isChatLoading"
                        (click)="sendChatMessage()">
                <ion-icon name="send" slot="icon-only"></ion-icon>
            </ion-button>
        </div>

    </div>
</div>

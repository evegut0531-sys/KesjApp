<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding auth-content">
  <div class="auth-container">
    <ion-card class="auth-card">
      <ion-card-header class="ion-text-center">
        <div class="auth-icon-wrapper">
          <ion-icon name="person-circle-outline" color="primary" class="auth-icon"></ion-icon>
        </div>
        <ion-card-title>¡Bienvenido!</ion-card-title>
        <ion-card-subtitle>Ingresa tus credenciales para continuar</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <ion-item lines="inset" class="custom-item">
            <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
            <ion-input
              type="email"
              label="Correo Electrónico"
              labelPlacement="floating"
              placeholder="ejemplo@correo.com"
              formControlName="email">
            </ion-input>
          </ion-item>
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error-message">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">El correo es obligatorio.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Ingresa un correo electrónico válido.</span>
          </div>

          <ion-item lines="inset" class="custom-item">
            <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              label="Contraseña"
              labelPlacement="floating"
              placeholder="••••••••"
              formControlName="password">
            </ion-input>
            <ion-button fill="clear" slot="end" (click)="toggleShowPassword()" type="button">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" slot="icon-only" color="medium"></ion-icon>
            </ion-button>
          </ion-item>
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-message">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres.</span>
          </div>

          <ion-button expand="block" type="submit" [disabled]="loginForm.invalid" class="ion-margin-top action-btn" color="primary">
            <ion-icon name="log-in-outline" slot="start"></ion-icon>
            Ingresar
          </ion-button>
        </form>

        <div class="auth-footer ion-text-center ion-margin-top">
          <p>¿No tienes una cuenta?</p>
          <ion-button fill="outline" expand="block" routerLink="/register" color="secondary" class="sub-action-btn">
            <ion-icon name="person-add-outline" slot="start"></ion-icon>
            Crear cuenta nueva
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
